# docker-compose.yml
# Defines services for local development, including MySQL and PostgreSQL databases.

services:
  mysql:
    image: mysql:9.5
    ports:
      - "3306:3306"
    environment:
      # Root password (empty for convenience in development)
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      # User credentials for the PetClinic application
      - MYSQL_USER=petclinic
      - MYSQL_PASSWORD=petclinic
      # Database name for the PetClinic application
      - MYSQL_DATABASE=petclinic
    volumes:
      # Mount custom configuration directory (read-only)
      - "./conf.d:/etc/mysql/conf.d:ro"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:18.1
    ports:
      - "5432:5432"
    environment:
      # User credentials for the PetClinic application
      - POSTGRES_PASSWORD=petclinic
      - POSTGRES_USER=petclinic
      # Database name for the PetClinic application
      - POSTGRES_DB=petclinic
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      timeout: 20s
      retries: 10
      start_period: 10s
