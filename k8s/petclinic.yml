---
apiVersion: v1
kind: Service
metadata:
  name: petclinic
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: petclinic

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  labels:
    app: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
        - name: workload
          image: node-petclinic-app:latest # Use a Docker image built from your Node.js app
          env:
            # Assumes environment variables are passed (e.g., from a Secret or ConfigMap)
            # DATABASE_URL, PORT, etc.
            - name: DATABASE_URL
              value: "postgres://user:pass@demo-db:5432/petclinic" # Link to your K8s database service
            - name: PORT
              value: "8080"
            - name: SERVICE_BINDING_ROOT
              value: /bindings
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health # Or a more specific liveness endpoint
              port: http
          readinessProbe:
            httpGet:
              path: /health # Or a more specific readiness endpoint
              port: http
          volumeMounts:
            - mountPath: /bindings/secret
              name: binding
              readOnly: true
      volumes:
        - name: binding
          projected:
            sources:
              - secret:
                  name: demo-db
