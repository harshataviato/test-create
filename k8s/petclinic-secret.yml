# k8s/petclinic-secret.yml
# Kubernetes Secret for storing database credentials securely.
# Base64 encoded values are used here; in production, use a secret management system.

apiVersion: v1
kind: Secret
metadata:
  name: petclinic-db-credentials
type: Opaque
data:
  # Base64 encoded values for PostgreSQL (replace with your actual credentials)
  # Example: echo -n 'petclinic' | base64
  postgres_user: cGV0Y2xpbmlj
  postgres_password: cGV0Y2xpbmlj
  postgres_db: cGV0Y2xpbmlj

  # Base64 encoded values for MySQL (if using MySQL, uncomment and replace)
  # mysql_user: cGV0Y2xpbmlj
  # mysql_password: cGV0Y2xpbmlj
  # mysql_db: cGV0Y2xpbmlj
