// This is a Spring Boot application properties file for PostgreSQL configuration.
// It defines database connection settings and initialization mode for a Java application.
// This is not Java code and cannot be converted to TypeScript directly.
// In a Node.js/TypeScript project, similar environment-specific configurations would
// typically be handled using:
// - Environment variables (e.g., loaded by the 'dotenv' package).
// - A configuration file (e.g., 'config/development.json', 'config/production.json', or '.env').
// Here's a conceptual '.env' file equivalent:

# .env (or .env.development, .env.production)
#
# Postgres database configuration
DB_TYPE=postgres
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
POSTGRES_USER=petclinic
POSTGRES_PASS=petclinic
POSTGRES_DATABASE=petclinic

# Database initialization mode (conceptual equivalent)
# In Node.js, this would be a flag read by your ORM (e.g., TypeORM, Prisma)
# or a custom script.
DB_INIT_MODE=always

// Your Node.js application would then load these using `process.env`.
// Example in a TypeScript startup file:
// import 'dotenv/config'; // Loads .env variables
//
// const dbConfig = {
//   host: process.env.POSTGRES_HOST || 'localhost',
//   port: parseInt(process.env.POSTGRES_PORT || '5432', 10),
//   username: process.env.POSTGRES_USER || 'petclinic',
//   password: process.env.POSTGRES_PASS || 'petclinic',
//   database: process.env.POSTGRES_DATABASE || 'petclinic',
// };
// console.log('Database URL:', `jdbc:postgresql://${dbConfig.host}:${dbConfig.port}/${dbConfig.database}`);
// console.log('Database User:', dbConfig.username);
// console.log('Database Password: [REDACTED]');
// console.log('SQL Init Mode:', process.env.DB_INIT_MODE || 'never');

# database init, supports postgres too
database=postgres
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost/petclinic}
spring.datasource.username=${POSTGRES_USER:petclinic}
spring.datasource.password=${POSTGRES_PASS:petclinic}
# SQL is written to be idempotent so this is safe
spring.sql.init.mode=always

