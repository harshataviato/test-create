<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 60px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #4CAF50;
            font-size: 3em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!--
            This is a placeholder for the message that would typically be
            injected by a server-side templating engine (e.g., EJS, Handlebars, Pug)
            or client-side JavaScript when rendering a web page.
            For this simple 'Hello World' example, we'll hardcode it,
            but in a real web application, this would be dynamic.
        -->
        <h1>Hello World!</h1>
        <p>This message is served from a TypeScript application.</p>
    </div>
</body>
</html>
