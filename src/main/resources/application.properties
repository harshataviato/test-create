// This is a Spring Boot application properties file. It defines general configuration
// for a Java application, such as database settings (H2 in this default case),
// web settings (Thymeleaf mode), JPA configurations, internationalization basename,
// Actuator endpoint exposure, and logging levels.
//
// This is not Java code and cannot be converted to TypeScript directly.
// In a Node.js/TypeScript project, similar configurations would typically be managed via:
// - Environment variables (e.g., loaded by the 'dotenv' package).
// - A structured configuration file (e.g., JSON, YAML, or a TypeScript file that exports config objects).
// - A dedicated configuration service/module.
//
// Here's a conceptual representation using environment variables and a TypeScript config object:

// Example of a conceptual TypeScript configuration file (e.g., `src/config/app.config.ts`)
/*
import 'dotenv/config'; // Make sure to load environment variables first

export const appConfig = {
  // Database configuration
  database: {
    type: process.env.DB_TYPE || 'h2', // 'h2', 'mysql', 'postgres'
    schemaLocations: process.env.DB_SCHEMA_LOCATIONS || `db/${process.env.DB_TYPE || 'h2'}/schema.sql`,
    dataLocations: process.env.DB_DATA_LOCATIONS || `db/${process.env.DB_TYPE || 'h2'}/data.sql`,
    // For H2 in-memory, you might just configure a TypeORM connection:
    // type: 'sqlite',
    // database: ':memory:',
    // synchronize: true, // For schema init
    // logging: false,
  },

  // Web / Templating (if using server-side rendering like Pug, EJS, or Handlebars)
  web: {
    templateEngineMode: process.env.TEMPLATE_ENGINE_MODE || 'html', // e.g., 'html' for Thymeleaf equivalent
  },

  // ORM / Data layer (conceptual JPA equivalents, e.g., TypeORM, Prisma)
  orm: {
    ddlAuto: process.env.ORM_DDL_AUTO || 'none', // 'none', 'update', 'create'
    openInView: process.env.ORM_OPEN_IN_VIEW === 'true' // Boolean from string
  },

  // Internationalization
  i18n: {
    basename: process.env.I18N_BASENAME || 'messages/messages', // Path to i18n resources
    // In Node.js, this typically points to JSON files (e.g., `src/locales/en.json`, `src/locales/de.json`)
  },

  // Monitoring / Health Endpoints (conceptual Actuator equivalent)
  monitoring: {
    endpoints: {
      web: {
        exposure: {
          include: process.env.MONITORING_ENDPOINTS_INCLUDE || '*', // e.g., exposed endpoints for health checks
        },
      },
    },
  },

  // Logging
  logging: {
    level: {
      // Configure specific module log levels (e.g., using 'winston' or 'pino')
      default: process.env.LOG_LEVEL_DEFAULT || 'info',
      // 'org.springframework': 'INFO' -> conceptual: 'express': 'info' or your ORM logger level
    },
  },

  // Caching (for static resources)
  cache: {
    staticResourcesMaxAge: process.env.STATIC_RESOURCES_CACHE_MAX_AGE || '12h', // e.g., '12h'
  },
};
*/

# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Internationalization
spring.messages.basename=messages/messages

# Actuator
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

