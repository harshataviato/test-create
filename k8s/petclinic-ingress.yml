# k8s/petclinic-ingress.yml
# Kubernetes Ingress to expose the PetClinic application to external traffic.
# Requires an Ingress Controller (e.g., Nginx, GCE Ingress) to be installed in your cluster.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petclinic-nodejs-ingress
  annotations:
    # Add any Ingress controller specific annotations here (e.g., for Nginx):
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: petclinic.example.com # Replace with your actual domain or IP/DNS
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: petclinic-nodejs-service # Points to the Node.js application's Service
            port:
              number: 8080
