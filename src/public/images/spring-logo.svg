2.  **Database Configuration:**
    By default, the application uses **SQLite**. The database file `petclinic.sqlite` will be created automatically in the root directory upon the first run.
    
    *   *Note:* The application is configured to **drop and re-seed** the database every time the server restarts (`force: true` in `server.js`). This mimics the in-memory behavior of the H2 database in the original Java application.

