// This is a Spring Boot application properties file specific to the 'mysql' profile.
// It overrides default database settings to connect to a MySQL database.
//
// This is not Java code and cannot be converted to TypeScript directly.
// In a Node.js/TypeScript project, this would typically be managed by:
// - Environment variables specific to a 'mysql' deployment (e.g., `MYSQL_URL`, `MYSQL_USER`).
// - A configuration file for a 'mysql' environment (e.g., `config/production.json` if using MySQL in production).
// - A conditional configuration loading based on a 'profile' or 'environment' variable.
//
// Here's a conceptual '.env' file equivalent for a MySQL profile:

# .env.mysql
#
# MySQL database configuration
DB_TYPE=mysql
MYSQL_HOST=localhost
MYSQL_PORT=3306
MYSQL_USER=petclinic
MYSQL_PASS=petclinic
MYSQL_DATABASE=petclinic

# Database initialization mode (conceptual equivalent)
DB_INIT_MODE=always

// Your Node.js application would load these based on an active profile.
// Example: if `NODE_ENV=mysql` is set, load `.env.mysql`.
//
// import 'dotenv/config'; // Loads .env
// import dotenv from 'dotenv';
//
// const envFile = `.env.${process.env.NODE_ENV || 'development'}`;
// dotenv.config({ path: envFile, override: true }); // Load profile-specific overrides
//
// const dbConfig = {
//   url: process.env.MYSQL_URL || `jdbc:mysql://${process.env.MYSQL_HOST || 'localhost'}/${process.env.MYSQL_DATABASE || 'petclinic'}`,
//   username: process.env.MYSQL_USER || 'petclinic',
//   password: process.env.MYSQL_PASS || 'petclinic',
//   // ... other MySQL specific settings
// };

# database init, supports mysql too
database=mysql
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost/petclinic}
spring.datasource.username=${MYSQL_USER:petclinic}
spring.datasource.password=${MYSQL_PASS:petclinic}
# SQL is written to be idempotent so this is safe
spring.sql.init.mode=always

