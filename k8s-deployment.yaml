apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
      - name: petclinic
        image: petclinic-node:latest
        ports:
        - containerPort: 3000
        env:
        - name: DB_DIALECT
          value: "sqlite" # Using SQLite for simple K8s demo without PVC complexity
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic-service
spec:
  selector:
    app: petclinic
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
