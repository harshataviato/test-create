apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
      - name: petclinic
        image: petclinic-node:latest
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /management/health
            port: 3000
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
