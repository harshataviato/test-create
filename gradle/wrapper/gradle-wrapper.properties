// This is a configuration file for the Gradle Wrapper. It defines properties
// like the base directory for Gradle distributions, the URL to download Gradle from,
// and network timeouts.
// In a Node.js/TypeScript project, similar configuration might be managed via
// environment variables (e.g., in a .env file), a dedicated config file (e.g., config.json),
// or directly within build scripts. This file is not converted to TypeScript code itself.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.2.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

